name: Feature request
description: 提议新的业务能力或交互改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 业务场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的流程、输入和输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 当前如何绕过，或考虑过哪些替代方式？
