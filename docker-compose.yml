x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mediaforge}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-mediaforge}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis-broker:6379/0
  MINIO_ENDPOINT_URL: http://minio:9000
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-/api/v1/files}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediaforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mediaforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-broker:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-mediaforge};
      mc anonymous set none local/${MINIO_BUCKET:-mediaforge};
      "

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    profiles: ["local-milvus"]
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.20
    profiles: ["local-milvus"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MQ_TYPE: woodpecker
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  migrate:
    build: .
    image: mediaforge-backend:local
    env_file: .env
    environment: *app-environment
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: mediaforge-backend:local
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file: .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  celery-worker:
    image: mediaforge-backend:local
    restart: unless-stopped
    command: celery -A mediaforge.celery_app worker --loglevel=info -Q high,normal,low --concurrency=8
    env_file: .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  celery-beat:
    image: mediaforge-backend:local
    restart: unless-stopped
    command: celery -A mediaforge.celery_app beat --loglevel=info
    env_file: .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-broker:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ALLOW_SELF_SIGNUP: ${ALLOW_SELF_SIGNUP:-false}
        BACKEND_URL: http://api:8100
    image: mediaforge-frontend:local
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_ALLOW_SELF_SIGNUP: ${ALLOW_SELF_SIGNUP:-false}
      BACKEND_URL: http://api:8100
    ports:
      - "3100:3100"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  etcddata:
  milvusdata:
